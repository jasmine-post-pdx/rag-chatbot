[project]
name = "rag-chatbot"
version = "0.1.0"
description = "A laboratory for building and evaluating retrieval-augmented generation systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "openai>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "tiktoken>=0.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx2>=0.1",
]
embeddings = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not openai_smoke and not embeddings_smoke and not vector_db'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "openai_smoke: opt-in test that calls the real OpenAI Responses API",
    "embeddings_smoke: opt-in test that loads a local sentence-transformers model",
    "vector_db: opt-in test that requires Postgres/pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py311"
