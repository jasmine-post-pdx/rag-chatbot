services:
  app:
    build: .
    image: rag-chatbot:local
    ports:
      - "8000:8000"
    env_file:
      # Forwards OPENAI_API_KEY, GENERATION_MAX_OUTPUT_TOKENS, and
      # GENERATION_INSTRUCTIONS when the file defines them. Omitted so an
      # unset key is not passed as an empty string, which settings reject.
      - path: .env
        required: false
    environment:
      QUESTIONS_DB_PATH: /app/data/questions.db
      QUESTIONS_ARCHIVE_DIR: ${QUESTIONS_ARCHIVE_DIR:-data/question_archives}
      QUESTIONS_BACKUP_DIR: ${QUESTIONS_BACKUP_DIR:-data/question_backups}
      QUESTIONS_LIVE_RETENTION_DAYS: ${QUESTIONS_LIVE_RETENTION_DAYS:-30}
      QUESTIONS_ARCHIVE_RETENTION_DAYS: ${QUESTIONS_ARCHIVE_RETENTION_DAYS:-365}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-raglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglab}
      POSTGRES_DB: ${POSTGRES_DB:-raglab}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-local}
      GENERATION_MODEL: ${GENERATION_MODEL:-stub}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-30}
      GENERATION_MAX_RETRIES: ${GENERATION_MAX_RETRIES:-2}
    volumes:
      - questions_data:/app/data
    restart: unless-stopped

  postgres:
    profiles:
      - vector-db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raglab}
      POSTGRES_USER: ${POSTGRES_USER:-raglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  questions_data:
  postgres_data:
